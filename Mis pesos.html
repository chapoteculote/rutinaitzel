<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Mis pesos</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Figtree:wght@400;500;600&display=swap">
<style>
/* Layout: una sola columna estrecha, pestañas de día arriba y ejercicios separados por líneas finas, con el registro de pesos junto a cada uno. */
:root {
  --bg: #fff5f8;
  --surface: #ffffff;
  --ink: #3d2630;
  --muted: #94707e;
  --pink: #f4a6bd;
  --pink-strong: #c9416d;
  --pink-soft: #fde4ec;
  --line: #f5d5e0;
  --on-pink: #ffffff;
  --font-display: "Instrument Serif", "Iowan Old Style", Georgia, serif;
  --font-body: "Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #1d1318;
    --surface: #281a21;
    --ink: #fbe9f0;
    --muted: #c4a0b0;
    --pink: #e58aa9;
    --pink-strong: #f08cae;
    --pink-soft: #3a222c;
    --line: #4a2d38;
    --on-pink: #2a1119;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #1d1318;
  --surface: #281a21;
  --ink: #fbe9f0;
  --muted: #c4a0b0;
  --pink: #e58aa9;
  --pink-strong: #f08cae;
  --pink-soft: #3a222c;
  --line: #4a2d38;
  --on-pink: #2a1119;
  color-scheme: dark;
}

* { box-sizing: border-box; }
body {
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font-body);
  font-size: 16px;
  line-height: 1.45;
  padding-block: 28px 56px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.wrap { max-width: 560px; margin-inline: auto; }

header { padding-bottom: 20px; }
.eyebrow {
  font-size: 12px; letter-spacing: .14em; text-transform: uppercase;
  color: var(--pink-strong); font-weight: 600; margin: 0 0 6px;
}
h1 {
  font-family: var(--font-display); font-weight: 400;
  font-size: clamp(40px, 11vw, 56px); line-height: 1.02; margin: 0;
  text-wrap: balance;
}
h1 em { color: var(--pink-strong); }
.sub { color: var(--muted); margin: 10px 0 0; max-width: 40ch; }

.tabs { display: flex; flex-wrap: wrap; gap: 8px; margin: 8px 0 26px; }
.tab {
  font: inherit; font-weight: 500; font-size: 15px;
  background: var(--surface); color: var(--ink);
  border: 1px solid var(--line); border-radius: 999px;
  padding: 9px 16px; cursor: pointer;
  transition: background .15s, border-color .15s, color .15s;
}
.tab:hover { border-color: var(--pink); }
.tab[aria-selected="true"] { background: var(--pink-strong); border-color: var(--pink-strong); color: var(--on-pink); }
.tab small { display: block; font-size: 11px; font-weight: 500; opacity: .75; letter-spacing: .04em; }
.tab { text-align: left; line-height: 1.2; }

.dayhead { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 12px; margin-bottom: 4px; }
.dayhead h2 { font-family: var(--font-display); font-weight: 400; font-size: 32px; margin: 0; line-height: 1.1; }
.tag {
  font-size: 12px; letter-spacing: .08em; text-transform: uppercase; font-weight: 600;
  background: var(--pink-soft); color: var(--pink-strong);
  padding: 3px 10px; border-radius: 999px;
}
.focus { color: var(--muted); margin: 0 0 8px; }

.ex { padding: 20px 0; border-top: 1px solid var(--line); min-width: 0; }
.ex:last-child { border-bottom: 1px solid var(--line); }
.exhead { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 4px 12px; }
.exname { font-weight: 600; font-size: 17px; margin: 0; min-width: 0; overflow-wrap: anywhere; }
.scheme { font-size: 14px; color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
.last { font-size: 14px; color: var(--muted); margin: 4px 0 0; min-height: 21px; }
.last b { color: var(--pink-strong); font-weight: 600; }

.add { display: flex; gap: 8px; margin-top: 12px; }
.add input {
  flex: 1; min-width: 0;
  font: inherit; color: var(--ink);
  background: var(--surface); border: 1px solid var(--line); border-radius: 12px;
  padding: 11px 14px;
}
.add input::placeholder { color: var(--muted); opacity: .8; }
.add input:focus-visible, .btn:focus-visible, .tab:focus-visible, .more:focus-visible, .del:focus-visible {
  outline: 2px solid var(--pink-strong); outline-offset: 2px;
}
.btn {
  font: inherit; font-weight: 600; cursor: pointer;
  background: var(--pink-strong); color: var(--on-pink);
  border: 0; border-radius: 12px; padding: 11px 18px;
}
.btn:active { transform: translateY(1px); }

.hist { list-style: none; margin: 12px 0 0; padding: 0; display: flex; flex-wrap: wrap; gap: 6px; }
.hist li {
  display: inline-flex; align-items: center; gap: 4px;
  background: var(--pink-soft); border-radius: 999px;
  padding: 4px 4px 4px 12px; font-size: 14px; font-variant-numeric: tabular-nums;
}
.hist .d { color: var(--muted); }
.hist .w { font-weight: 600; }
.del {
  font: inherit; line-height: 1; width: 24px; height: 24px; border-radius: 50%;
  border: 0; background: transparent; color: var(--muted); cursor: pointer;
}
.del:hover { background: var(--line); color: var(--ink); }
.more {
  font: inherit; font-size: 14px; background: none; border: 0; cursor: pointer;
  color: var(--pink-strong); padding: 6px 4px; text-decoration: underline; text-underline-offset: 3px;
}

.foot { margin-top: 22px; font-size: 13px; color: var(--muted); display: flex; align-items: center; gap: 8px; }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--pink); flex: none; }

@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

<div class="wrap">
  <header>
    <p class="eyebrow">Objetivo glúteos</p>
    <h1>Mis <em>pesos</em></h1>
    <p class="sub">Elige el día, apunta el peso de cada ejercicio y la próxima vez lo verás aquí.</p>
  </header>

  <div class="tabs" role="tablist" id="tabs" aria-label="Días de entrenamiento"></div>
  <section id="panel" role="tabpanel" aria-live="polite"></section>

  <p class="foot"><span class="dot"></span><span id="status">Cargando tus pesos…</span></p>
</div>

<script>
(function () {
  var DAYS = [
    { id: "lunes", name: "Lunes", short: "Lun", tag: "Fuerza", focus: "Glúteos, cuádriceps y aductor", wd: 1,
      ex: [["Sentadilla hack","4","6-8"],["Hip thrust","4","6-8"],["Extensión de cuádriceps","3","10-12"],["Máquina de aductores","3","10-12"]] },
    { id: "martes", name: "Martes", short: "Mar", tag: "", focus: "Pecho, hombro y tríceps", wd: 2,
      ex: [["Press de pecho en máquina","3","10-12"],["Aperturas de pecho en máquina (pec deck)","3","12-15"],["Press militar con mancuernas","3","8-10"],["Elevaciones laterales","3","12-15"],["Extensión de tríceps en polea","3","10-15"]] },
    { id: "jueves", name: "Jueves", short: "Jue", tag: "", focus: "Espalda y bíceps", wd: 4,
      ex: [["Jalón al pecho","3","8-12"],["Remo en polea baja","3","10-12"],["Dominadas asistidas","3","8-12"],["Curl con barra Z","3","10-12"],["Curl martillo","3","10-12"]] },
    { id: "viernes", name: "Viernes", short: "Vie", tag: "Hipertrofia", focus: "Glúteos, femoral y aductor", wd: 5,
      ex: [["Hip thrust normal","3","10-12"],["Peso muerto rumano","3","10-12"],["Curl femoral tumbada","3","12-15"],["Zancadas caminando","3","12 por pierna"],["Máquina de aductores","3","12-15"]] }
  ];
  var LS_KEY = "mis-pesos-v1";
  var VISIBLE = 4;

  var store = {};      // { "lunes:0": [ {d:"2026-10-19", w:"60"} ] }
  var drafts = {};     // texto escrito y aún no apuntado
  var expanded = {};   // ejercicios con historial completo
  var current = pickDay();
  var ref = null;      // documento privado en db, si hay
  var mode = "local";
  var writing = false, dirty = false;

  var tabsEl = document.getElementById("tabs");
  var panelEl = document.getElementById("panel");
  var statusEl = document.getElementById("status");

  function pickDay() {
    var wd = new Date().getDay();
    for (var i = 0; i < DAYS.length; i++) if (DAYS[i].wd >= wd) return DAYS[i].id;
    return DAYS[0].id;
  }
  function todayKey() {
    var t = new Date();
    return t.getFullYear() + "-" + String(t.getMonth() + 1).padStart(2, "0") + "-" + String(t.getDate()).padStart(2, "0");
  }
  function fmtDate(k) {
    var p = k.split("-");
    return new Date(+p[0], +p[1] - 1, +p[2]).toLocaleDateString("es-ES", { day: "numeric", month: "short" }).replace(".", "");
  }
  function el(tag, cls, text) {
    var n = document.createElement(tag);
    if (cls) n.className = cls;
    if (text != null) n.textContent = text;
    return n;
  }

  /* ---------- guardado ---------- */
  function localLoad() {
    try { var r = localStorage.getItem(LS_KEY); if (r) return JSON.parse(r) || {}; } catch (e) {}
    return {};
  }
  function localSave() {
    try { localStorage.setItem(LS_KEY, JSON.stringify(store)); } catch (e) {}
  }
  function setStatus() {
    statusEl.textContent = mode === "cloud"
      ? "Tus pesos se guardan en tu cuenta."
      : "Tus pesos se guardan en este dispositivo.";
  }
  async function persist() {
    localSave();
    if (!ref) return;
    if (writing) { dirty = true; return; }
    writing = true;
    try {
      do {
        dirty = false;
        await ref.set({ entries: store, updated: Date.now() });
      } while (dirty);
    } catch (e) {
      mode = "local"; ref = null; setStatus();
    }
    writing = false;
  }
  async function connect() {
    try {
      var user = await claude.use("user");
      var db = await claude.use("db");
      var id = user ? await user.id() : null;
      if (!db || !id) { setStatus(); return; }
      var r = db.doc("data/users/" + id + "/log");
      var first = true;
      r.onSnapshot(function (snap) {
        if (snap.metadata.hasPendingWrites) return;
        if (snap.exists) {
          var remote = (snap.data() || {}).entries || {};
          if (JSON.stringify(remote) !== JSON.stringify(store)) { store = remote; localSave(); render(); }
        } else if (first && Object.keys(store).length) {
          persist();
        }
        first = false;
        ref = r; mode = "cloud"; setStatus();
      }, function () { ref = null; mode = "local"; setStatus(); });
    } catch (e) { setStatus(); }
  }

  /* ---------- acciones ---------- */
  function addEntry(key, text) {
    var w = text.trim();
    if (!w) return;
    var list = (store[key] || []).filter(function (x) { return x.d !== todayKey(); });
    list.push({ d: todayKey(), w: w });
    list.sort(function (a, b) { return a.d < b.d ? 1 : -1; });
    store[key] = list;
    drafts[key] = "";
    persist();
    render();
  }
  function removeEntry(key, d) {
    store[key] = (store[key] || []).filter(function (x) { return x.d !== d; });
    persist();
    render();
  }

  /* ---------- pintado ---------- */
  function renderTabs() {
    tabsEl.textContent = "";
    DAYS.forEach(function (d) {
      var b = el("button", "tab");
      b.type = "button";
      b.setAttribute("role", "tab");
      b.setAttribute("aria-selected", String(d.id === current));
      b.appendChild(document.createTextNode(d.name));
      b.addEventListener("click", function () {
        current = d.id;
        try { history.replaceState(null, "", "#" + d.id); } catch (e) {}
        render();
      });
      tabsEl.appendChild(b);
    });
  }
  function renderExercise(day, ex, i) {
    var key = day.id + ":" + i;
    var list = (store[key] || []).slice().sort(function (a, b) { return a.d < b.d ? 1 : -1; });
    var row = el("div", "ex");

    var head = el("div", "exhead");
    head.appendChild(el("h3", "exname", ex[0]));
    head.appendChild(el("span", "scheme", ex[1] + " × " + ex[2]));
    row.appendChild(head);

    var last = el("p", "last");
    if (list.length) {
      last.appendChild(document.createTextNode("Última vez: "));
      last.appendChild(el("b", null, list[0].w + " kg"));
      last.appendChild(document.createTextNode(" · " + fmtDate(list[0].d)));
    } else {
      last.textContent = "Aún sin pesos. Apunta el de hoy.";
    }
    row.appendChild(last);

    var form = el("form", "add");
    var input = el("input");
    input.type = "text";
    input.id = "w-" + day.id + "-" + i;
    input.setAttribute("inputmode", "decimal");
    input.setAttribute("autocomplete", "off");
    input.setAttribute("aria-label", "Peso de hoy en " + ex[0]);
    input.placeholder = "Peso de hoy (kg)";
    input.value = drafts[key] || "";
    input.addEventListener("input", function () { drafts[key] = input.value; });
    var btn = el("button", "btn", "Apuntar");
    btn.type = "submit";
    form.appendChild(input);
    form.appendChild(btn);
    form.addEventListener("submit", function (e) { e.preventDefault(); addEntry(key, input.value); });
    row.appendChild(form);

    if (list.length) {
      var shown = expanded[key] ? list : list.slice(0, VISIBLE);
      var ul = el("ul", "hist");
      shown.forEach(function (h) {
        var li = el("li");
        li.appendChild(el("span", "d", fmtDate(h.d)));
        li.appendChild(el("span", "w", h.w + " kg"));
        var x = el("button", "del", "×");
        x.type = "button";
        x.setAttribute("aria-label", "Borrar " + h.w + " kg del " + fmtDate(h.d));
        x.addEventListener("click", function () { removeEntry(key, h.d); });
        li.appendChild(x);
        ul.appendChild(li);
      });
      row.appendChild(ul);
      if (list.length > VISIBLE) {
        var more = el("button", "more", expanded[key] ? "Ver menos" : "Ver todo (" + list.length + ")");
        more.type = "button";
        more.addEventListener("click", function () { expanded[key] = !expanded[key]; render(); });
        row.appendChild(more);
      }
    }
    return row;
  }
  function render() {
    renderTabs();
    var day = DAYS.filter(function (d) { return d.id === current; })[0];
    panelEl.textContent = "";
    var head = el("div", "dayhead");
    head.appendChild(el("h2", null, day.name));
    if (day.tag) head.appendChild(el("span", "tag", day.tag));
    panelEl.appendChild(head);
    panelEl.appendChild(el("p", "focus", day.focus));
    day.ex.forEach(function (ex, i) { panelEl.appendChild(renderExercise(day, ex, i)); });
  }

  var h = (location.hash || "").replace("#", "");
  if (DAYS.some(function (d) { return d.id === h; })) current = h;
  store = localLoad();
  render();
  setStatus();
  statusEl.textContent = "Tus pesos se guardan en este dispositivo.";
  connect();
})();
</script>

</body></html>
